<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title">
  <title id="title">Backend Developer, Sanjana Kalarickal. Open to SWE roles, summer 2027. skalarickal@ucsd.edu</title>
  <style>
    .h1 { font: 800 70px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #fbf4f7; letter-spacing: -.01em; }
    .name { font: italic 500 44px Georgia, 'Times New Roman', serif; fill: #ff8fb8; }
    .contact { font: 500 16px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #eadde3; }
    .status { font: 500 16px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #9ee6c9; }

    /* entrance: only the start frame is set, so a static render still shows everything */
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(3); } }

    /* the only motion in the pixel art: a terminal cursor */
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes cursor { 50% { opacity: 0; } }
  </style>

  <!-- card -->
  <rect x="2" y="2" width="1196" height="416" rx="26" fill="#141016" stroke="#2e2429" stroke-width="2"/>

  <!-- text -->
  <text class="h1 rise" x="64" y="132">Backend Developer</text>
  <text class="name rise" x="67" y="190" style="animation-delay:.15s">Sanjana Kalarickal</text>

  <!-- divider -->
  <g class="rise" style="animation-delay:.35s">
    <rect x="68" y="224" width="168" height="4" fill="#ff8fb8"/>
    <path d="M248 220h4v4h4v4h-4v4h-4v-4h-4v-4h4Z" fill="#ffe08a"/>
  </g>

  <!-- status -->
  <g class="rise" style="animation-delay:.55s">
    <circle cx="82" cy="270" r="17" fill="#9ee6c9" fill-opacity=".18"/>
    <circle cx="82" cy="270" r="5.5" fill="#9ee6c9"/>
    <circle class="pulse" cx="82" cy="270" r="5.5" fill="#9ee6c9"/>
    <text class="status" x="110" y="276">open to SWE roles · summer 2027 · UC San Diego CS</text>
  </g>

  <!-- email, bottom left -->
  <g class="rise" style="animation-delay:.75s">
    <circle cx="82" cy="356" r="17" fill="#b9a2ff"/>
    <rect x="73" y="350" width="18" height="12" rx="2" fill="none" stroke="#141016" stroke-width="1.8"/>
    <path d="M74 351l8 6 8-6" fill="none" stroke="#141016" stroke-width="1.8"/>
    <text class="contact" x="110" y="361">skalarickal@ucsd.edu</text>
  </g>

