<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" role="img" aria-labelledby="title">
  <title id="title">Downstream: Finds everything a pull request can affect in a TypeScript monorepo, and who should review.</title>
  <defs>
    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#b9a2ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#b9a2ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#b9a2ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#b9a2ff" stop-opacity=".22"/><stop offset="1" stop-color="#b9a2ff" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="438" height="248" rx="18"/></clipPath>
  </defs>
  <style>
    .label { font: 600 11.5px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #b9a2ff; letter-spacing: .14em; }
    .name { font: 500 30px Georgia, 'Times New Roman', serif; fill: #fbf4f7; }
    .line { font: 400 14.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cbb8c1; }
    .stat { font: italic 500 24px Georgia, 'Times New Roman', serif; fill: #b9a2ff; }
    .statl { font: 400 12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8f7b85; }
    .tag { font: 500 11.5px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #b9a2ff; }
    .arrow { font: 600 20px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #b9a2ff; animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translate(3px, -3px); } }
    .sweep { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-460px); } 45%, 100% { transform: translateX(460px); } }
  </style>
  <rect x="1" y="1" width="438" height="248" rx="18" fill="#161216"/>
  <rect x="1" y="1" width="438" height="248" rx="18" fill="none" stroke="#2e2429" stroke-width="2"/>
  <text class="label" x="28" y="40">DEV TOOLING</text>
  <text class="arrow" x="398" y="44">&#8599;</text>
  <text class="name" x="28" y="80">Downstream</text>
  <text class="line" x="28" y="110">Finds everything a pull request can affect</text>
  <text class="line" x="28" y="130">in a TypeScript monorepo, and who should review.</text>
  <text class="stat" x="28" y="170">100%</text>
  <text class="statl" x="28" y="190">agreement with tsc's own resolver, enforced in CI</text>
  <rect x="28" y="206" width="92" height="22" rx="11" fill="#b9a2ff" fill-opacity=".12" stroke="#b9a2ff" stroke-opacity=".5"/>
  <text class="tag" x="74" y="221" text-anchor="middle">TypeScript</text>
  <rect x="128" y="206" width="70" height="22" rx="11" fill="#b9a2ff" fill-opacity=".12" stroke="#b9a2ff" stroke-opacity=".5"/>
  <text class="tag" x="163" y="221" text-anchor="middle">Node.js</text>
  <rect x="206" y="206" width="42" height="22" rx="11" fill="#b9a2ff" fill-opacity=".12" stroke="#b9a2ff" stroke-opacity=".5"/>
  <text class="tag" x="227" y="221" text-anchor="middle">Zod</text>
  <rect x="256" y="206" width="34" height="22" rx="11" fill="#b9a2ff" fill-opacity=".12" stroke="#b9a2ff" stroke-opacity=".5"/>
  <text class="tag" x="273" y="221" text-anchor="middle">CI</text>
</svg>