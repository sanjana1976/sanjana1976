<svg xmlns="http://www.w3.org/2000/svg" width="150" height="48" viewBox="0 0 150 48" role="img" aria-label="LinkedIn">
  <style>
    .t { font: 700 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #b9a2ff; }
    .g { transform-box: fill-box; transform-origin: center; animation: wiggle 3s ease-in-out infinite; }
    @keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-12deg); } 90% { transform: rotate(10deg); } 95% { transform: rotate(-6deg); } }
  </style>
  <rect x="1" y="1" width="148" height="46" rx="23" fill="#141016"/>
  <rect x="1" y="1" width="148" height="46" rx="23" fill="#b9a2ff" fill-opacity=".1" stroke="#2e2429" stroke-width="1.5"/>
  <g class="g"><rect x="22" y="16" width="16" height="16" rx="3.5" fill="#b9a2ff"/><text x="30" y="28.5" text-anchor="middle" style="font:800 11px Arial,sans-serif;fill:#141016">in</text></g>
  <text class="t" x="48" y="29">LinkedIn</text>
</svg>