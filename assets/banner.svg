<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title">
  <title id="title">Backend Developer, Sanjana Kalarickal. Open to SWE roles, summer 2027. skalarickal@ucsd.edu</title>
  <defs>
    <radialGradient id="b1" cx="86%" cy="18%" r="45%"><stop offset="0" stop-color="#ff8fb8" stop-opacity=".30"/><stop offset="1" stop-color="#ff8fb8" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx="8%" cy="100%" r="45%"><stop offset="0" stop-color="#b9a2ff" stop-opacity=".22"/><stop offset="1" stop-color="#b9a2ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx="55%" cy="0%" r="35%"><stop offset="0" stop-color="#ffad85" stop-opacity=".14"/><stop offset="1" stop-color="#ffad85" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff8fb8"/><stop offset=".5" stop-color="#b9a2ff"/><stop offset="1" stop-color="#ffad85"/>
    </linearGradient>
    <linearGradient id="hgrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd6e5"/>
    </linearGradient>
  </defs>
  <style>
    .h1 { font: 800 70px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#hgrad); letter-spacing: -.01em; }
    .name { font: italic 500 44px Georgia, 'Times New Roman', serif; fill: #ff8fb8; }
    .contact { font: 500 16px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #eadde3; }
    .status { font: 500 16px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #9ee6c9; }
    .bubble { font: 600 15px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #ffd6e5; }

    /* entrance: only the start frame is set, so a static render still shows everything */
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.6,.5,1) backwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.4); } }

    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.55) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(20deg); } }
    .heart { animation: heart 4s ease-in infinite; }
    @keyframes heart { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-70px); } }

    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
    .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 1.4s ease-in-out infinite alternate; }
    @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
    .float { animation: float 3.2s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-5px); } }
    .led { animation: led 1.1s steps(2) infinite; }
    @keyframes led { 50% { opacity: .25; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(3); } }
  </style>

  <!-- card -->
  <rect x="2" y="2" width="1196" height="416" rx="26" fill="#141016"/>
  <rect x="2" y="2" width="1196" height="416" rx="26" fill="url(#b1)"/>
  <rect x="2" y="2" width="1196" height="416" rx="26" fill="url(#b2)"/>
  <rect x="2" y="2" width="1196" height="416" rx="26" fill="url(#b3)"/>
  <rect x="2" y="2" width="1196" height="416" rx="26" fill="none" stroke="url(#edge)" stroke-width="3" opacity=".75"/>

  <!-- polka dots, top right -->
  <g fill="#b9a2ff" opacity=".18">
    <circle cx="1080" cy="352" r="3"/><circle cx="1100" cy="352" r="3"/><circle cx="1120" cy="352" r="3"/><circle cx="1140" cy="352" r="3"/><circle cx="1160" cy="352" r="3"/>
    <circle cx="1090" cy="370" r="3"/><circle cx="1110" cy="370" r="3"/><circle cx="1130" cy="370" r="3"/><circle cx="1150" cy="370" r="3"/>
    <circle cx="1100" cy="388" r="3"/><circle cx="1120" cy="388" r="3"/><circle cx="1140" cy="388" r="3"/>
  </g>

  <!-- text -->
  <text class="h1 rise" x="64" y="132">Backend Developer</text>
  <text class="name rise" x="67" y="190" style="animation-delay:.15s">Sanjana Kalarickal</text>

  <!-- divider -->
  <g class="rise" style="animation-delay:.35s">
    <!-- a gradient stroke on a zero-height line needs user-space units -->
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="68" y1="0" x2="236" y2="0">
      <stop offset="0" stop-color="#ff8fb8"/><stop offset=".5" stop-color="#b9a2ff"/><stop offset="1" stop-color="#ffad85"/>
    </linearGradient>
    <line x1="68" y1="226" x2="236" y2="226" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(252 226)"><path class="spark" d="M0-7 1.6-1.6 7 0 1.6 1.6 0 7-1.6 1.6-7 0-1.6-1.6Z" fill="#ffc2d8"/></g>
  </g>

  <!-- status -->
  <g class="rise" style="animation-delay:.55s">
    <circle cx="82" cy="270" r="17" fill="#9ee6c9" fill-opacity=".18"/>
    <circle cx="82" cy="270" r="5.5" fill="#9ee6c9"/>
    <circle class="pulse" cx="82" cy="270" r="5.5" fill="#9ee6c9"/>
    <text class="status" x="110" y="276">open to SWE roles · summer 2027 · UC San Diego CS</text>
  </g>

  <!-- email, bottom left -->
  <g class="rise" style="animation-delay:.75s">
    <circle cx="82" cy="356" r="17" fill="#b9a2ff"/>
    <rect x="73" y="350" width="18" height="12" rx="2" fill="none" stroke="#141016" stroke-width="1.8"/>
    <path d="M74 351l8 6 8-6" fill="none" stroke="#141016" stroke-width="1.8"/>
    <text class="contact" x="110" y="361">skalarickal@ucsd.edu</text>
  </g>

  <!-- sparkles -->
  <g transform="translate(870 70)"><path class="spark" d="M0-10 2.2-2.2 10 0 2.2 2.2 0 10-2.2 2.2-10 0-2.2-2.2Z" fill="#ffc2d8"/></g>
  <g transform="translate(1150 220)"><path class="spark" style="animation-delay:.7s" d="M0-8 1.8-1.8 8 0 1.8 1.8 0 8-1.8 1.8-8 0-1.8-1.8Z" fill="#b9a2ff"/></g>
  <g transform="translate(860 250)"><path class="spark" style="animation-delay:1.4s" d="M0-7 1.6-1.6 7 0 1.6 1.6 0 7-1.6 1.6-7 0-1.6-1.6Z" fill="#ffad85"/></g>
  <g transform="translate(790 40)"><path class="spark" style="animation-delay:2s" d="M0-6 1.4-1.4 6 0 1.4 1.4 0 6-1.4 1.4-6 0-1.4-1.4Z" fill="#9ee6c9"/></g>
  <g transform="translate(1170 60)"><path class="spark" style="animation-delay:1s" d="M0-6 1.4-1.4 6 0 1.4 1.4 0 6-1.4 1.4-6 0-1.4-1.4Z" fill="#ffe08a"/></g>

  <!-- hearts drifting up from the cat -->
  <path class="heart" d="M1036 150c-3-5-11-3-10 3 1 4 10 9 10 9s9-5 10-9c1-6-7-8-10-3Z" fill="#ff8fb8"/>
  <path class="heart" style="animation-delay:1.8s" d="M922 160c-2.5-4-9-2.5-8 2.5 .8 3.3 8 7.5 8 7.5s7.2-4.2 8-7.5c1-5-5.5-6.5-8-2.5Z" fill="#b9a2ff"/>

  <!-- speech bubble -->
  <g class="float">
    <rect x="1030" y="82" width="146" height="40" rx="14" fill="#2a1a22" stroke="#ff8fb8" stroke-opacity=".6"/>
    <path d="M1046 121 1034 138 1062 121Z" fill="#2a1a22" stroke="#ff8fb8" stroke-opacity=".6" stroke-linejoin="round"/>
    <rect x="1044" y="119" width="20" height="4" fill="#2a1a22"/>
    <text class="bubble" x="1103" y="107" text-anchor="middle">200 OK · 38ms</text>
  </g>

  <!-- shadow + tiny server -->
  <ellipse cx="980" cy="316" rx="100" ry="8" fill="#000" opacity=".35"/>
  <rect x="900" y="262" width="160" height="50" rx="10" fill="#241a20" stroke="#4a3540" stroke-width="2"/>
  <circle class="led" cx="920" cy="287" r="4" fill="#ff8fb8"/>
  <circle class="led" cx="936" cy="287" r="4" fill="#9ee6c9" style="animation-delay:.4s"/>
  <circle class="led" cx="952" cy="287" r="4" fill="#b9a2ff" style="animation-delay:.8s"/>
  <g stroke="#4a3540" stroke-width="3" stroke-linecap="round">
    <line x1="992" y1="279" x2="1042" y2="279"/><line x1="992" y1="287" x2="1042" y2="287"/><line x1="992" y1="295" x2="1042" y2="295"/>
  </g>

  <!-- cat -->
  <g transform="translate(0 30)">
    <path class="tail" d="M1020 226 C1052 222 1062 196 1052 170" fill="none" stroke="#f6dfe8" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="980" cy="200" rx="48" ry="38" fill="#fbe9f0"/>
    <ellipse cx="980" cy="208" rx="26" ry="22" fill="#fff6f9"/>
    <ellipse cx="962" cy="236" rx="13" ry="7" fill="#fff6f9" stroke="#efcbd9"/>
    <ellipse cx="998" cy="236" rx="13" ry="7" fill="#fff6f9" stroke="#efcbd9"/>
    <path d="M950 128 946 90 976 114Z" fill="#fbe9f0"/>
    <path d="M1010 128 1014 90 984 114Z" fill="#fbe9f0"/>
    <path d="M953 120 951 100 968 113Z" fill="#ffaecb"/>
    <path d="M1007 120 1009 100 992 113Z" fill="#ffaecb"/>
    <circle cx="980" cy="146" r="37" fill="#fbe9f0"/>
    <!-- bow -->
    <path d="M1000 116l-12-8v16Z M1000 116l12-8v16Z" fill="#b9a2ff"/>
    <circle cx="1000" cy="116" r="4" fill="#d6c8ff"/>
    <ellipse class="eye" cx="966" cy="144" rx="4.5" ry="6" fill="#2b1d24"/>
    <ellipse class="eye" cx="994" cy="144" rx="4.5" ry="6" fill="#2b1d24"/>
    <circle cx="967.5" cy="141.5" r="1.5" fill="#fff"/>
    <circle cx="995.5" cy="141.5" r="1.5" fill="#fff"/>
    <circle cx="955" cy="158" r="7" fill="#ff9ec4" opacity=".45"/>
    <circle cx="1005" cy="158" r="7" fill="#ff9ec4" opacity=".45"/>
    <path d="M976 153h8l-4 4Z" fill="#ff6fa3"/>
    <path d="M974 160q6 6 6 0q0 6 6 0" fill="none" stroke="#2b1d24" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
