<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250" role="img" aria-labelledby="title">
  <title id="title">Smart Doc Search: Two-stage retrieval that finds the right transcript for any question.</title>
  <defs>
    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#7fdcc0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7fdcc0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7fdcc0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#7fdcc0" stop-opacity=".22"/><stop offset="1" stop-color="#7fdcc0" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="438" height="248" rx="18"/></clipPath>
  </defs>
  <style>
    .label { font: 600 11.5px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #7fdcc0; letter-spacing: .14em; }
    .name { font: 500 30px Georgia, 'Times New Roman', serif; fill: #fbf4f7; }
    .line { font: 400 14.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cbb8c1; }
    .stat { font: italic 500 24px Georgia, 'Times New Roman', serif; fill: #7fdcc0; }
    .statl { font: 400 12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8f7b85; }
    .tag { font: 500 11.5px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #7fdcc0; }
    .arrow { font: 600 20px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7fdcc0; animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translate(3px, -3px); } }
    .sweep { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-460px); } 45%, 100% { transform: translateX(460px); } }
  </style>
  <rect x="1" y="1" width="438" height="248" rx="18" fill="#161216"/>
  <rect x="1" y="1" width="438" height="248" rx="18" fill="url(#glow)" stroke="#7fdcc0" stroke-opacity=".45" stroke-width="2"/>
  <g clip-path="url(#card)"><g transform="skewX(-12)"><rect class="sweep" x="0" y="0" width="300" height="250" fill="url(#sheen)"/></g></g>
  <text class="label" x="28" y="40">RETRIEVAL</text>
  <text class="arrow" x="398" y="44">&#8599;</text>
  <text class="name" x="28" y="80">Smart Doc Search</text>
  <text class="line" x="28" y="110">Two-stage retrieval that finds the right</text>
  <text class="line" x="28" y="130">transcript for any question.</text>
  <text class="stat" x="28" y="170">FAISS &#8594; ColBERT</text>
  <text class="statl" x="28" y="190">bi-encoder shortlist, token-level re-rank</text>
  <rect x="28" y="206" width="63" height="22" rx="11" fill="#7fdcc0" fill-opacity=".12" stroke="#7fdcc0" stroke-opacity=".5"/>
  <text class="tag" x="59.5" y="221" text-anchor="middle">Python</text>
  <rect x="99" y="206" width="70" height="22" rx="11" fill="#7fdcc0" fill-opacity=".12" stroke="#7fdcc0" stroke-opacity=".5"/>
  <text class="tag" x="134" y="221" text-anchor="middle">PyTorch</text>
  <rect x="177" y="206" width="56" height="22" rx="11" fill="#7fdcc0" fill-opacity=".12" stroke="#7fdcc0" stroke-opacity=".5"/>
  <text class="tag" x="205" y="221" text-anchor="middle">FAISS</text>
  <rect x="241" y="206" width="106" height="22" rx="11" fill="#7fdcc0" fill-opacity=".12" stroke="#7fdcc0" stroke-opacity=".5"/>
  <text class="tag" x="294" y="221" text-anchor="middle">Hugging Face</text>
</svg>