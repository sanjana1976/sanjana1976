<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title">
  <title id="title">Sanjana Kalarickal, backend engineer focused on speed</title>
  <defs>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0" stop-color="#ff8fb8" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ff8fb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" x2="1">
      <stop offset="0" stop-color="#ffc2d8"/>
      <stop offset="1" stop-color="#ff6fa3"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 500 72px Georgia, 'Times New Roman', serif; fill: #fbf4f7; }
    .em { font-style: italic; fill: url(#pink); }
    .lead { font: 400 23px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eadde3; }
    .sub { font: 400 18px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #a8949e; }
    .mono { font: 500 14px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #ff9ec4; letter-spacing: .04em; }
    .bubble { font: 600 15px ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; fill: #ffd6e5; }

    /* entrance: only the start frame is set, so a static render still shows everything */
    .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.55); } 50% { opacity: 1; transform: scale(1); } }

    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }

    .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 1.4s ease-in-out infinite alternate; }
    @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }

    .float { animation: float 3.2s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-5px); } }

    .led { animation: led 1.1s steps(2) infinite; }
    @keyframes led { 50% { opacity: .25; } }

    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes pulse { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(3); } }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="318" rx="24" fill="#121012" stroke="#3a2a32" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="318" rx="24" fill="url(#glow)"/>

  <!-- text -->
  <text class="name rise" x="70" y="140">Sanjana <tspan class="em">Kalarickal</tspan></text>
  <text class="lead rise" x="72" y="192" style="animation-delay:.25s">Backend engineer focused on speed.</text>
  <text class="sub rise" x="72" y="226" style="animation-delay:.4s">Low-latency APIs · real-time systems · pipelines that answer in seconds</text>

  <g class="rise" style="animation-delay:.6s">
    <circle cx="78" cy="271" r="5" fill="#ff8fb8"/>
    <circle class="pulse" cx="78" cy="271" r="5" fill="#ff8fb8"/>
    <text class="mono" x="94" y="276">open to SWE roles · summer 2027 · UC San Diego CS</text>
  </g>

  <!-- sparkles -->
  <g transform="translate(842 78)"><path class="spark" d="M0-9 2-2 9 0 2 2 0 9-2 2-9 0-2-2Z" fill="#ffc2d8"/></g>
  <g transform="translate(1150 196)"><path class="spark" style="animation-delay:.8s" d="M0-7 1.6-1.6 7 0 1.6 1.6 0 7-1.6 1.6-7 0-1.6-1.6Z" fill="#ff8fb8"/></g>
  <g transform="translate(870 210)"><path class="spark" style="animation-delay:1.5s" d="M0-6 1.4-1.4 6 0 1.4 1.4 0 6-1.4 1.4-6 0-1.4-1.4Z" fill="#ffd6e5"/></g>
  <g transform="translate(760 54)"><path class="spark" style="animation-delay:2s" d="M0-5 1.2-1.2 5 0 1.2 1.2 0 5-1.2 1.2-5 0-1.2-1.2Z" fill="#ff9ec4"/></g>

  <!-- speech bubble -->
  <g class="float">
    <rect x="1030" y="58" width="146" height="40" rx="14" fill="#2a1a22" stroke="#6b3a52"/>
    <path d="M1046 97 1034 114 1062 97Z" fill="#2a1a22" stroke="#6b3a52" stroke-linejoin="round"/>
    <rect x="1044" y="95" width="20" height="4" fill="#2a1a22"/>
    <text class="bubble" x="1103" y="83" text-anchor="middle">200 OK · 38ms</text>
  </g>

  <!-- shadow -->
  <ellipse cx="980" cy="286" rx="100" ry="8" fill="#000" opacity=".35"/>

  <!-- tiny server the cat sits on -->
  <rect x="900" y="232" width="160" height="50" rx="10" fill="#241a20" stroke="#4a3540" stroke-width="2"/>
  <circle class="led" cx="920" cy="257" r="4" fill="#ff8fb8"/>
  <circle class="led" cx="936" cy="257" r="4" fill="#8ce99a" style="animation-delay:.4s"/>
  <g stroke="#4a3540" stroke-width="3" stroke-linecap="round">
    <line x1="992" y1="249" x2="1042" y2="249"/>
    <line x1="992" y1="257" x2="1042" y2="257"/>
    <line x1="992" y1="265" x2="1042" y2="265"/>
  </g>

  <!-- cat -->
  <path class="tail" d="M1020 226 C1052 222 1062 196 1052 170" fill="none" stroke="#f6dfe8" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="980" cy="200" rx="48" ry="38" fill="#fbe9f0"/>
  <ellipse cx="980" cy="208" rx="26" ry="22" fill="#fff6f9"/>
  <ellipse cx="962" cy="236" rx="13" ry="7" fill="#fff6f9" stroke="#efcbd9"/>
  <ellipse cx="998" cy="236" rx="13" ry="7" fill="#fff6f9" stroke="#efcbd9"/>
  <path d="M950 128 946 90 976 114Z" fill="#fbe9f0"/>
  <path d="M1010 128 1014 90 984 114Z" fill="#fbe9f0"/>
  <path d="M953 120 951 100 968 113Z" fill="#ffaecb"/>
  <path d="M1007 120 1009 100 992 113Z" fill="#ffaecb"/>
  <circle cx="980" cy="146" r="37" fill="#fbe9f0"/>
  <ellipse class="eye" cx="966" cy="144" rx="4.5" ry="6" fill="#2b1d24"/>
  <ellipse class="eye" cx="994" cy="144" rx="4.5" ry="6" fill="#2b1d24"/>
  <circle cx="967.5" cy="141.5" r="1.5" fill="#fff"/>
  <circle cx="995.5" cy="141.5" r="1.5" fill="#fff"/>
  <circle cx="955" cy="158" r="7" fill="#ff9ec4" opacity=".45"/>
  <circle cx="1005" cy="158" r="7" fill="#ff9ec4" opacity=".45"/>
  <path d="M976 153h8l-4 4Z" fill="#ff6fa3"/>
  <path d="M974 160q6 6 6 0q0 6 6 0" fill="none" stroke="#2b1d24" stroke-width="1.6" stroke-linecap="round"/>
</svg>
