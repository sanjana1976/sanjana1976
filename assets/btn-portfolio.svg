<svg xmlns="http://www.w3.org/2000/svg" width="150" height="48" viewBox="0 0 150 48" role="img" aria-label="Portfolio">
  <style>
    .t { font: 700 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ff8fb8; }
    .g { transform-box: fill-box; transform-origin: center; animation: wiggle 3s ease-in-out infinite; }
    @keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-12deg); } 90% { transform: rotate(10deg); } 95% { transform: rotate(-6deg); } }
  </style>
  <rect x="1" y="1" width="148" height="46" rx="23" fill="#141016"/>
  <rect x="1" y="1" width="148" height="46" rx="23" fill="#ff8fb8" fill-opacity=".14" stroke="#ff8fb8" stroke-opacity=".7" stroke-width="1.5"/>
  <g class="g"><g fill="none" stroke="#ff8fb8" stroke-width="1.8"><circle cx="30" cy="24" r="8"/><ellipse cx="30" cy="24" rx="3.5" ry="8"/><line x1="22" y1="24" x2="38" y2="24"/></g></g>
  <text class="t" x="48" y="29">Portfolio</text>
</svg>